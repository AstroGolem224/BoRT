[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bort"
version = "0.1.0"
description = "BoR Transcriber (BoRT) – Audio-Transkription für BookofRecords"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "itiger013"}
]
keywords = ["whisper", "transcription", "speech-to-text", "diarization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "customtkinter>=5.0",
    "pillow>=12.3.0",
    "pycairo",
    "PyGObject",
    "pywebview",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
bort = "bort.cli:main"
bort-gui = "bort.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bort = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["vendor", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
